<svg xmlns="http://www.w3.org/2000/svg" width="760" height="790" class="a-svg" viewBox="0 0 760 790" role="img" aria-labelledby="svc-t svc-d"><title id="svc-t">Requests, services and data access</title><desc id="svc-d">Browsers reach web, which calls core. An AI client reaches core over MCP. Core reaches PostgreSQL, object storage, WorkOS AuthKit and Redis, and probes the optional intelligence service, which can call a model gateway. The text equivalent follows the image.</desc><style>svg.a-svg{--a-bg:#ffffff;--a-node:#ffffff;--a-stroke:#7c6d67;--a-text:#0c0a09;--a-muted:#5f524d;--a-accent:#253b55}
@media (prefers-color-scheme: dark){svg.a-svg{--a-bg:#1d1816;--a-node:#0c0a09;--a-stroke:#8a8583;--a-text:#fbfaf9;--a-muted:#aba09c;--a-accent:#c9d839}}
.a-bg{fill:var(--a-bg)}
.a-node rect{fill:var(--a-node);stroke:var(--a-stroke);stroke-width:1.5}
.a-core rect{stroke:var(--a-accent);stroke-width:3}
.a-opt rect{stroke-dasharray:7 5}
.a-org>rect{fill:none;stroke:var(--a-accent);stroke-width:3}
.a-title{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:500;font-size:19px;fill:var(--a-text)}
.a-body,.a-label{font-family:Geist,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:var(--a-text)}
.a-label{font-size:14.5px}
.a-line{stroke:var(--a-accent);stroke-width:2.5;fill:none}
.a-head{fill:var(--a-accent)}
.a-lg rect{fill:var(--a-node);stroke:var(--a-stroke);stroke-width:1.5}
@font-face{font-family:Oswald;src:url("../fonts/oswald/oswald-wght.ttf") format("truetype");font-weight:200 700}
@font-face{font-family:Geist;src:url("../fonts/geist/geist-wght.ttf") format("truetype");font-weight:100 900}</style><rect class="a-bg" width="760" height="790"/><g class="a-node" data-node="browser"><rect x="20" y="20" width="210" height="82" rx="9"/><text class="a-title" x="32" y="47">Browser</text><text class="a-body" x="32" y="47"><tspan x="32" y="73">People using the web app.</tspan></text></g><g class="a-node" data-node="ai"><rect x="250" y="20" width="210" height="82" rx="9"/><text class="a-title" x="262" y="47">AI client</text><text class="a-body" x="262" y="47"><tspan x="262" y="73">An external MCP client</tspan><tspan x="262" y="92">a member connected.</tspan></text></g><g class="a-node a-opt" data-node="gateway"><rect x="500" y="20" width="240" height="82" rx="9"/><text class="a-title" x="512" y="47">Model gateway</text><text class="a-body" x="512" y="47"><tspan x="512" y="73">OpenRouter, only when</tspan><tspan x="512" y="92">enabled.</tspan></text></g><g class="a-node" data-node="web"><rect x="20" y="170" width="210" height="120" rx="9"/><text class="a-title" x="32" y="197">web</text><text class="a-body" x="32" y="197"><tspan x="32" y="223">Thin server-side bridge.</tspan><tspan x="32" y="242">No authority or policy;</tspan><tspan x="32" y="261">no datastore, WorkOS or</tspan><tspan x="32" y="280">gateway credentials.</tspan></text></g><g class="a-node a-opt" data-node="intelligence"><rect x="500" y="170" width="240" height="120" rx="9"/><text class="a-title" x="512" y="197">intelligence</text><text class="a-body" x="512" y="197"><tspan x="512" y="223">Optional internal AI</tspan><tspan x="512" y="242">execution. Not reachable</tspan><tspan x="512" y="261">from a browser; no</tspan><tspan x="512" y="280">data-store access.</tspan></text></g><g class="a-node a-core" data-node="core"><rect x="20" y="370" width="720" height="82" rx="9"/><text class="a-title" x="32" y="397">core</text><text class="a-body" x="32" y="397"><tspan x="32" y="423">Owns identity and sessions, tenancy, the authorization decision, audit, storage, domains and MCP.</tspan><tspan x="32" y="442">Resolves the Organization on the server.</tspan></text></g><g class="a-node" data-node="postgres"><rect x="20" y="540" width="165" height="139" rx="9"/><text class="a-title" x="32" y="567">PostgreSQL</text><text class="a-body" x="32" y="567"><tspan x="32" y="593">Durable state.</tspan><tspan x="32" y="612">Least-privilege</tspan><tspan x="32" y="631">runtime role under</tspan><tspan x="32" y="650">forced row-level</tspan><tspan x="32" y="669">security.</tspan></text></g><g class="a-node" data-node="storage"><rect x="205" y="540" width="165" height="139" rx="9"/><text class="a-title" x="217" y="567">Object storage</text><text class="a-body" x="217" y="567"><tspan x="217" y="593">S3-compatible API</tspan><tspan x="217" y="612">(MinIO locally).</tspan><tspan x="217" y="631">Bucket-scoped user.</tspan><tspan x="217" y="650">Core-internal: no</tspan><tspan x="217" y="669">route exposes it.</tspan></text></g><g class="a-node" data-node="workos"><rect x="390" y="540" width="165" height="139" rx="9"/><text class="a-title" x="402" y="567">WorkOS AuthKit</text><text class="a-body" x="402" y="567"><tspan x="402" y="593">Hosted sign-in</tspan><tspan x="402" y="612">provider.</tspan><tspan x="402" y="631">API key lives in</tspan><tspan x="402" y="650">core only.</tspan></text></g><g class="a-node" data-node="redis"><rect x="575" y="540" width="165" height="139" rx="9"/><text class="a-title" x="587" y="567">Redis</text><text class="a-body" x="587" y="567"><tspan x="587" y="593">Ephemeral.</tspan><tspan x="587" y="612">Readiness check</tspan><tspan x="587" y="631">only today.</tspan></text></g><g class="a-edge" data-edge="browser>web"><line class="a-line" x1="125" y1="102" x2="125" y2="161"/><polygon class="a-head" points="125,170 119,160 131,160"/></g><text class="a-label" data-for="browser>web"><tspan x="137" y="140">HTTPS via your TLS edge</tspan></text><g class="a-edge" data-edge="web>core"><line class="a-line" x1="125" y1="290" x2="125" y2="361"/><polygon class="a-head" points="125,370 119,360 131,360"/></g><text class="a-label" data-for="web>core"><tspan x="137" y="335">internal URL, server-side</tspan></text><g class="a-edge" data-edge="ai>core"><line class="a-line" x1="355" y1="102" x2="355" y2="361"/><polygon class="a-head" points="355,370 349,360 361,360"/></g><text class="a-label" data-for="ai>core"><tspan x="367" y="140">MCP, one URL</tspan><tspan x="367" y="158">per connection;</tspan><tspan x="367" y="176">each call is</tspan><tspan x="367" y="194">reauthorized</tspan></text><g class="a-edge" data-edge="intelligence>gateway"><line class="a-line" x1="620" y1="170" x2="620" y2="111"/><polygon class="a-head" points="620,102 614,112 626,112"/></g><text class="a-label" data-for="intelligence>gateway"><tspan x="632" y="134">HTTPS, only</tspan><tspan x="632" y="152">when enabled</tspan></text><g class="a-edge" data-edge="core>intelligence"><line class="a-line" x1="620" y1="370" x2="620" y2="299"/><polygon class="a-head" points="620,290 614,300 626,300"/></g><text class="a-label" data-for="core>intelligence"><tspan x="632" y="325">readiness</tspan><tspan x="632" y="343">probe only</tspan></text><g class="a-edge" data-edge="core>postgres"><line class="a-line" x1="102" y1="452" x2="102" y2="531"/><polygon class="a-head" points="102,540 96,530 108,530"/></g><text class="a-label" data-for="core>postgres"><tspan x="112" y="500">durable state</tspan></text><g class="a-edge" data-edge="core>storage"><line class="a-line" x1="287" y1="452" x2="287" y2="531"/><polygon class="a-head" points="287,540 281,530 293,530"/></g><text class="a-label" data-for="core>storage"><tspan x="297" y="500">S3-compatible API</tspan></text><g class="a-edge" data-edge="core>workos"><line class="a-line" x1="472" y1="452" x2="472" y2="531"/><polygon class="a-head" points="472,540 466,530 478,530"/></g><text class="a-label" data-for="core>workos"><tspan x="482" y="500">HTTPS API</tspan></text><g class="a-edge" data-edge="core>redis"><line class="a-line" x1="657" y1="452" x2="657" y2="531"/><polygon class="a-head" points="657,540 651,530 663,530"/></g><text class="a-label" data-for="core>redis"><tspan x="667" y="494">readiness</tspan><tspan x="667" y="512">only</tspan></text><g class="a-lg" data-legend="1"><line class="a-line" x1="20" y1="730" x2="54" y2="730"/><polygon class="a-head" points="64,730 54,724 54,736"/></g><text class="a-label"><tspan x="76" y="735">arrow: a call from source to target</tspan></text><g class="a-lg a-core" data-legend="1"><rect x="330" y="721" width="26" height="18" rx="4" style="stroke:var(--a-accent);stroke-width:3"/></g><text class="a-label"><tspan x="366" y="735">accent border: authority</tspan></text><g class="a-lg" data-legend="1"><rect x="560" y="721" width="26" height="18" rx="4" style="stroke-dasharray:5 3"/></g><text class="a-label"><tspan x="596" y="735">dashed: optional</tspan></text></svg>
