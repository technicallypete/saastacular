<svg xmlns="http://www.w3.org/2000/svg" width="760" height="990" class="a-svg" viewBox="0 0 760 990" role="img" aria-labelledby="auth-t auth-d"><title id="auth-t">Organization, Group and tenant authority</title><desc id="auth-d">An authenticated person is resolved on the server to an Organization, the tenant boundary, which contains Organization roles, Groups and Business Profiles. Three separate authority boundaries apply inside it, enforced by the RoleBinding store, core's deny-by-default policy and PostgreSQL row-level security. The text equivalent follows the image.</desc><style>svg.a-svg{--a-bg:#ffffff;--a-node:#ffffff;--a-stroke:#7c6d67;--a-text:#0c0a09;--a-muted:#5f524d;--a-accent:#253b55}
@media (prefers-color-scheme: dark){svg.a-svg{--a-bg:#1d1816;--a-node:#0c0a09;--a-stroke:#8a8583;--a-text:#fbfaf9;--a-muted:#aba09c;--a-accent:#c9d839}}
.a-bg{fill:var(--a-bg)}
.a-node rect{fill:var(--a-node);stroke:var(--a-stroke);stroke-width:1.5}
.a-core rect{stroke:var(--a-accent);stroke-width:3}
.a-opt rect{stroke-dasharray:7 5}
.a-org>rect{fill:none;stroke:var(--a-accent);stroke-width:3}
.a-title{font-family:Oswald,"Arial Narrow",Arial,sans-serif;font-weight:500;font-size:19px;fill:var(--a-text)}
.a-body,.a-label{font-family:Geist,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:var(--a-text)}
.a-label{font-size:14.5px}
.a-line{stroke:var(--a-accent);stroke-width:2.5;fill:none}
.a-head{fill:var(--a-accent)}
.a-lg rect{fill:var(--a-node);stroke:var(--a-stroke);stroke-width:1.5}
@font-face{font-family:Oswald;src:url("../fonts/oswald/oswald-wght.ttf") format("truetype");font-weight:200 700}
@font-face{font-family:Geist;src:url("../fonts/geist/geist-wght.ttf") format("truetype");font-weight:100 900}</style><rect class="a-bg" width="760" height="990"/><g class="a-node" data-node="person"><rect x="20" y="20" width="300" height="120" rx="9"/><text class="a-title" x="32" y="47">Authenticated person</text><text class="a-body" x="32" y="47"><tspan x="32" y="73">Identity is global:</tspan><tspan x="32" y="92">WorkOS AuthKit authenticates,</tspan><tspan x="32" y="111">core owns the session.</tspan></text></g><g class="a-node" data-node="resolve"><rect x="380" y="20" width="360" height="120" rx="9"/><text class="a-title" x="392" y="47">Resolved on the server</text><text class="a-body" x="392" y="47"><tspan x="392" y="73">The Organization comes from the</tspan><tspan x="392" y="92">authenticated session and the</tspan><tspan x="392" y="111">request host, never from a client-</tspan><tspan x="392" y="130">or model-supplied identifier.</tspan></text></g><g class="a-edge" data-edge="person>resolve"><line class="a-line" x1="320" y1="80" x2="371" y2="80"/><polygon class="a-head" points="380,80 370,74 370,86"/></g><g class="a-edge" data-edge="resolve>organization"><line class="a-line" x1="560" y1="140" x2="560" y2="181"/><polygon class="a-head" points="560,190 554,180 566,180"/></g><text class="a-label" data-for="resolve>organization"><tspan x="572" y="170">selects the tenant</tspan></text><g class="a-org" data-node="organization"><rect x="20" y="190" width="720" height="250" rx="12"/><text class="a-title" x="36" y="222">Organization: the tenant boundary</text></g><g class="a-node" data-node="orgroles"><rect x="36" y="240" width="222" height="180" rx="9"/><text class="a-title" x="48" y="267">Organization roles</text><text class="a-body" x="48" y="267"><tspan x="48" y="293">org_owner, org_admin,</tspan><tspan x="48" y="312">org_member.</tspan><tspan x="48" y="331">No role is global.</tspan></text></g><g class="a-node" data-node="groups"><rect x="269" y="240" width="222" height="180" rx="9"/><text class="a-title" x="281" y="267">Groups</text><text class="a-body" x="281" y="267"><tspan x="281" y="293">Collaboration scopes.</tspan><tspan x="281" y="312">Each is in exactly one</tspan><tspan x="281" y="331">Organization for life.</tspan><tspan x="281" y="350">Roles: group_owner,</tspan><tspan x="281" y="369">group_admin,</tspan><tspan x="281" y="388">group_member.</tspan></text></g><g class="a-node" data-node="profiles"><rect x="502" y="240" width="222" height="180" rx="9"/><text class="a-title" x="514" y="267">Business Profiles</text><text class="a-body" x="514" y="267"><tspan x="514" y="293">Reusable context owned</tspan><tspan x="514" y="312">by one Organization. A</tspan><tspan x="514" y="331">Group links to at most</tspan><tspan x="514" y="350">one profile of its own</tspan><tspan x="514" y="369">Organization; one profile</tspan><tspan x="514" y="388">can be shared by</tspan><tspan x="514" y="407">several Groups.</tspan></text></g><g class="a-edge" data-edge="organization>boundaries"><line class="a-line" x1="380" y1="440" x2="380" y2="491"/><polygon class="a-head" points="380,500 374,490 386,490"/></g><text class="a-label" data-for="organization>boundaries"><tspan x="392" y="476">three authority boundaries</tspan></text><g class="a-node" data-node="b1"><rect x="20" y="500" width="230" height="177" rx="9"/><text class="a-title" x="32" y="527">1. Read Group metadata</text><text class="a-body" x="32" y="527"><tspan x="32" y="553">Organization owners and</tspan><tspan x="32" y="572">admins read names, slugs,</tspan><tspan x="32" y="591">onboarding state and</tspan><tspan x="32" y="610">profile fields of every</tspan><tspan x="32" y="629">Group. Never rosters,</tspan><tspan x="32" y="648">invitations, tokens or</tspan><tspan x="32" y="667">objects.</tspan></text></g><g class="a-node" data-node="b2"><rect x="265" y="500" width="230" height="177" rx="9"/><text class="a-title" x="277" y="527">2. Manage a Group</text><text class="a-body" x="277" y="527"><tspan x="277" y="553">Needs an explicit Group</tspan><tspan x="277" y="572">owner or admin role, or</tspan><tspan x="277" y="591">the owner-controlled</tspan><tspan x="277" y="610">override: off by default,</tspan><tspan x="277" y="629">audited; no ownership</tspan><tspan x="277" y="648">powers and no self-join.</tspan></text></g><g class="a-node" data-node="b3"><rect x="510" y="500" width="230" height="177" rx="9"/><text class="a-title" x="522" y="527">3. Group content</text><text class="a-body" x="522" y="527"><tspan x="522" y="553">Needs an explicit Group</tspan><tspan x="522" y="572">role, whether the</tspan><tspan x="522" y="591">override is on or off.</tspan></text></g><g class="a-edge" data-edge="boundaries>enforcement"><line class="a-line" x1="380" y1="677" x2="380" y2="728"/><polygon class="a-head" points="380,737 374,727 386,727"/></g><text class="a-label" data-for="boundaries>enforcement"><tspan x="392" y="713">enforced in two layers</tspan></text><g class="a-node" data-node="bindings"><rect x="20" y="737" width="220" height="177" rx="9"/><text class="a-title" x="32" y="764">RoleBinding store</text><text class="a-body" x="32" y="764"><tspan x="32" y="790">The only place a role</tspan><tspan x="32" y="809">is written. Memberships</tspan><tspan x="32" y="828">are read-only views.</tspan></text></g><g class="a-node a-core" data-node="policy"><rect x="270" y="737" width="220" height="177" rx="9"/><text class="a-title" x="282" y="764">Policy in core</text><text class="a-body" x="282" y="764"><tspan x="282" y="790">One closed, deny-by-</tspan><tspan x="282" y="809">default policy. Every</tspan><tspan x="282" y="828">operation rechecks the</tspan><tspan x="282" y="847">session, user and facts.</tspan></text></g><g class="a-node" data-node="rls"><rect x="520" y="737" width="220" height="177" rx="9"/><text class="a-title" x="532" y="764">Row-level security</text><text class="a-body" x="532" y="764"><tspan x="532" y="790">In PostgreSQL. Core sets</tspan><tspan x="532" y="809">user, Organization and</tspan><tspan x="532" y="828">Group as transaction</tspan><tspan x="532" y="847">context first. Designed</tspan><tspan x="532" y="866">so an omitted predicate</tspan><tspan x="532" y="885">cannot expose another</tspan><tspan x="532" y="904">Organization.</tspan></text></g><g class="a-edge" data-edge="bindings>policy"><line class="a-line" x1="240" y1="825" x2="261" y2="825"/><polygon class="a-head" points="270,825 260,819 260,831"/></g><g class="a-edge" data-edge="policy>rls"><line class="a-line" x1="490" y1="825" x2="511" y2="825"/><polygon class="a-head" points="520,825 510,819 510,831"/></g><g class="a-lg" data-legend="1"><line class="a-line" x1="20" y1="955" x2="54" y2="955"/><polygon class="a-head" points="64,955 54,949 54,961"/></g><text class="a-label"><tspan x="76" y="960">arrow: leads to the next step</tspan></text><g class="a-lg a-core" data-legend="1"><rect x="330" y="946" width="26" height="18" rx="4" style="stroke:var(--a-accent);stroke-width:3"/></g><text class="a-label"><tspan x="366" y="960">accent border: authority</tspan></text></svg>
