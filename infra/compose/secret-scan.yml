# Submitted-source secret scan overlay (G012 Plan r1 §4.2). Used only by infra/security/secret-scan.sh, which
# streams the submitted set on stdin:
#   docker compose --env-file FILE -f infra/compose/local.yml -f infra/compose/secret-scan.yml --profile checks \
#     run --rm -T secret-scan
# Same pinned gitleaks image as local.yml; no volume (the working-directory bind mount is reset), no network, no
# ports, no environment. The stream holds scan/src/ (regular files and links, links never followed), scan/link-targets.txt
# (scanned link target text) and meta/{count-regular,count-links,gitleaks.toml}. The counts are checked before the scan.
# Exit: 0 only with gitleaks 0 and an empty report; 1 for findings with a parseable report; 2 for any unpack,
# accounting, report or scanner failure.
services:
  secret-scan:
    volumes: !reset []
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /tmp/w
        tar -x -C /tmp/w || { echo "secret-scan: the input stream cannot be unpacked" >&2; exit 2; }
        for f in count-regular count-links gitleaks.toml; do
          [ -f "/tmp/w/meta/$$f" ] || { echo "secret-scan: incomplete stream (meta/$$f)" >&2; exit 2; }
        done
        [ -d /tmp/w/scan/src ] || { echo "secret-scan: incomplete stream (scan/src)" >&2; exit 2; }
        reg=$$(find /tmp/w/scan/src -type f | wc -l)
        lnk=$$(find /tmp/w/scan/src -type l | wc -l)
        oth=$$(find /tmp/w/scan/src ! -type f ! -type l ! -type d | wc -l)
        wreg=$$(cat /tmp/w/meta/count-regular)
        wlnk=$$(cat /tmp/w/meta/count-links)
        if [ "$$reg" -le 0 ] || [ "$$reg" != "$$wreg" ] || [ "$$lnk" != "$$wlnk" ] || [ "$$oth" != 0 ]; then
          echo "secret-scan: accounting mismatch: regular $$reg (declared $$wreg), links $$lnk (declared $$wlnk), other $$oth" >&2
          exit 2
        fi
        echo "secret-scan: accounting ok: $$reg regular files, $$lnk links"
        rc=0
        gitleaks dir /tmp/w/scan --config /tmp/w/meta/gitleaks.toml --redact -v --no-banner --exit-code 23 \
          --report-format json --report-path /tmp/r.json || rc=$$?
        report=$$(tr -d ' \t\r\n' </tmp/r.json 2>/dev/null) || report=""
        if [ "$$rc" = 0 ] && [ "$$report" = "[]" ]; then exit 0; fi
        case "$$report" in
          "["*'"RuleID"'*"]") if [ "$$rc" = 23 ]; then echo "secret-scan: findings (redacted)" >&2; exit 1; fi ;;
        esac
        echo "secret-scan: scanner or report failure (gitleaks exit $$rc)" >&2
        exit 2
