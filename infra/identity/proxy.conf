# TLS test proxy for the identity overlay (infra/compose/identity.yml; G004; test only, never production).
# It runs in the web service's network namespace and serves the test names and the attacker origin on 543 (443 + 100)
# with the run's leaf certificate. G016: every *.localhost and *.acme.test name (platform, auth, public-entry, custom,
# removed and unknown hosts alike) passes to web unchanged: the Host header as sent, the body and any client-sent
# forwarding headers (web never reads them); web's host gate and core decide what each name is (the edge is not a
# tenant registry). G014: on those names only the MCP connection paths (/mcp/c/ and their protected-resource metadata)
# pass to core, with the Host header as sent; core's internal routes are never exposed (web answers 404 for them).
# attacker.localhost (an exact name, chosen before the patterns) serves only the static cross-origin attack page.
# G062: the public entry (localhost, www.localhost) is served by web like any other name (the root landing and signup;
# the marketing stand-in is removed), and a tenant created during the run (<slug>.localhost) matches the pattern at
# once, with no DNS or CNAME step. Any other name is refused.
server {
    listen 543 ssl default_server;
    server_name _;
    ssl_certificate /identity/proxy/tls.crt;
    ssl_certificate_key /identity/proxy/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 421;
}

server {
    listen 543 ssl;
    server_name localhost ~^[a-z0-9-]+\.localhost$ ~^[a-z0-9-]+\.acme\.test$;
    ssl_certificate /identity/proxy/tls.crt;
    ssl_certificate_key /identity/proxy/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    access_log off;

    # core is resolved per request (Docker's embedded DNS), so a core restart never leaves a stale address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $core http://core:8180;

    location /mcp/c/ {
        proxy_pass $core;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_buffering off;
    }
    location /.well-known/oauth-protected-resource/mcp/c/ {
        proxy_pass $core;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_buffering off;
    }
}

server {
    listen 543 ssl;
    server_name attacker.localhost;
    ssl_certificate /identity/proxy/tls.crt;
    ssl_certificate_key /identity/proxy/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    root /srv/attacker;

    location = / {
        try_files /index.html =404;
    }
    location / {
        return 404;
    }
}
